[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gitcontext"
version = "0.1.0"
description = "Your codebase, answered: a RAG developer copilot over code, commits, PRs, docs and postmortems with grounded, cited answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Navyashree Byregowda" }]
keywords = ["rag", "llm", "code-search", "hybrid-retrieval", "bm25", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
slack = ["slack-bolt>=1.18"]
st = ["sentence-transformers>=2.7"]
all = ["gitcontext[anthropic,openai,slack]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ask-repo = "gitcontext.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/sample_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
