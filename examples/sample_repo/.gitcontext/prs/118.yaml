number: 118
title: Use Decimal and banker's rounding for proration
author: marcus-chen
state: merged
created_at: 2026-02-10T14:00:00+00:00
merged_at: 2026-02-11T10:30:00+00:00
labels: [billing, bug]
files:
  - shopfront/billing/invoices.py
  - docs/billing.md
body: |
  Support found customers charged one cent too much after mid-cycle upgrades. prorate() used
  float division and ROUND_HALF_UP, which over-charged on about 0.4% of upgrades.

  Switched all money math to Decimal and round to the cent with ROUND_HALF_EVEN (banker's
  rounding). Tax is now applied once on the subtotal instead of per line item.
comments:
  - author: priya-raman
    body: Do we need to refund the affected customers?
  - author: marcus-chen
    body: Yes, finance is issuing credits for the 212 affected invoices; tracked in BILL-287.
