name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Configure git identity (sample repo replay creates commits)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Offline eval
        run: python -m gitcontext.cli eval
