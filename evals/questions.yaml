# gold: sources a good answer should draw on. Exact doc ids (code:<path>, doc:<path>, pr:<n>,
# discussion:<n>, incident:<id>) or `commit~<substring>` to match a commit by its subject, because
# commit shas depend on the git version that replays the history.
